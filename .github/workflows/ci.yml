name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff (conservative rules)
        run: ruff check . --select E4,E7,E9,F

      - name: Compile
        run: python -m compileall -q assistant_api tests

      - name: Unit tests (no OpenAI calls)
        env:
          OPENAI_API_KEY: ""
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Import web app
        env:
          OPENAI_API_KEY: ""
        run: python -c "import assistant_api.web_app; print('web_app import OK')"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          # порт публикуется только на localhost
          docker compose config | grep -q 'host_ip: 127.0.0.1'

      - name: Build image
        run: docker build -t rag-guarantees:ci .

      - name: Smoke test (no OpenAI calls)
        run: bash scripts/docker_smoke.sh rag-guarantees:ci
